appId: com.autonotebooklm.desktop
productName: BloqueAudio

asar: true

files:
  - "**/*"
  - "!runtime/**"
  - "!build/runtime-bootstrap/**"
  - "!dist/**"
  - "!data/**"
  - "!exports/**"

extraResources:
  - from: "build/runtime-bootstrap"
    to: "runtime-bootstrap"
  - from: "vendor/ffmpeg"
    to: "ffmpeg"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createStartMenuShortcut: true
  shortcutName: BloqueAudio (distribucion)
  runAfterFinish: false
  differentialPackage: "store-asar"
  artifactName: "BloqueAudio-Setup-${version}.${ext}"

electronUpdaterCompatibility: ">=2.16"

publish:
  provider: github
  owner: OWNER
  repo: auto-notebooklm-releases
